<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accpro Multi-Pay - Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #005596;
            --header: #004a82;
            --accent: #3b82f6;
            --bg: #f1f5f9;
            --text: #1e293b;
            --green: #10b981;
            --border: #e2e8f0;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow-x: hidden; }

        .overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { background: white; width: 100%; max-width: 450px; border-radius: 12px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .login-header { background: var(--primary); color: white; padding: 30px; text-align: center; position: relative; }
        .login-header .back-btn { position: absolute; left: 20px; top: 25px; color: white; cursor: pointer; }
        .login-header h2 { margin: 0; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.8; }
        .login-header h1 { margin: 10px 0 0; font-size: 18px; font-weight: 800; line-height: 1.4; }
        
        .login-tabs { display: flex; border-bottom: 2px solid var(--border); }
        .login-tab { flex: 1; padding: 15px; text-align: center; font-size: 12px; font-weight: 800; text-transform: uppercase; cursor: pointer; color: var(--subtext); border-bottom: 2px solid transparent; margin-bottom: -2px; }
        .login-tab.active { color: var(--primary); border-color: var(--primary); }

        .login-body { padding: 30px; background: #eeeeee; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 11px; font-weight: 800; color: var(--primary); text-transform: uppercase; margin-bottom: 8px; }
        .input-group input { width: 100%; padding: 15px; border: 2px solid #00559633; border-radius: 8px; font-size: 15px; font-weight: 600; box-sizing: border-box; background: #e9f1f9; }
        
        .login-btn { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 800; font-size: 14px; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .login-btn:disabled { opacity: 0.7; cursor: not-allowed; }
        
        #statusOverlay { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 15px 30px; border-radius: 50px; font-weight: 700; z-index: 3000; display: none; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }

        /* HEADER */
        header { background: #1e293b; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; color: white; position: sticky; top: 0; z-index: 1000; }
        .logo { font-weight: 800; font-size: 18px; display: flex; align-items: center; gap: 10px; }
        .user-chip { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 50px; font-size: 12px; font-weight: 600; cursor: pointer; }

        .app-container { width: 100%; max-width: 900px; margin: 30px auto; padding: 0 20px 100px; }
        .voucher-card { background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); padding: 30px; border: 1px solid var(--border); }
        
        .header-inputs { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 15px; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px dashed #e2e8f0; }
        label { display: block; font-size: 11px; font-weight: 800; color: #64748b; text-transform: uppercase; margin-bottom: 8px; }
        select, input, textarea { width: 100%; padding: 12px 15px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; font-weight: 600; box-sizing: border-box; }

        .payment-rows { margin-bottom: 20px; }
        .payment-row { background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 15px; position: relative; }
        .row-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .row-number { font-size: 11px; font-weight: 900; color: var(--primary); text-transform: uppercase; }
        .remove-btn { color: #ef4444; cursor: pointer; background: none; border: none; }

        .row-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 15px; margin-bottom: 15px; }

        .category-tabs { display: flex; gap: 5px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .tab { font-size: 10px; font-weight: 800; padding: 8px 14px; border-radius: 8px; background: white; border: 1px solid var(--border); cursor: pointer; white-space: nowrap; color: var(--text); }
        .tab.active { background: var(--primary); color: white; border-color: var(--primary); }

        .search-select { position: relative; }
        .search-trigger { width: 100%; padding: 12px 15px; background: white; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; }
        .search-dropdown { position: absolute; top: 100%; left: 0; width: 100%; background: white; border: 1px solid var(--border); border-radius: 10px; z-index: 100; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-top: 5px; }
        .search-dropdown.open { display: block; }
        .search-input { padding: 8px; border-bottom: 1px solid #f1f5f9; }
        .options-list { max-height: 200px; overflow-y: auto; }
        .option-item { padding: 10px; cursor: pointer; font-size: 13px; display: flex; justify-content: space-between; }
        .option-item:hover { background: #f1f5f9; }

        .against-box { background: #f0f9ff; padding: 20px; border-radius: 14px; margin-top: 15px; border: 1px solid #bae6fd; }
        .mode-banner { background: #f8fafc; padding: 10px 15px; border-radius: 8px; font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 20px; border: 1px solid var(--border); }
        .detail-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .auto-btn { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 10px; font-weight: 800; display: flex; align-items: center; gap: 5px; }

        .add-row-btn { width: 100%; padding: 12px; background: white; border: 2px dashed var(--primary); color: var(--primary); border-radius: 12px; font-weight: 800; cursor: pointer; margin-bottom: 30px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        .footer-summary { background: #1e293b; color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .total-value { font-size: 24px; font-weight: 900; color: var(--green); }

        #submitBtn { width: 100%; padding: 20px; background: var(--green); color: white; border: none; border-radius: 12px; font-weight: 900; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        #submitBtn:disabled { background: #94a3b8; }
    </style>
</head>
<body>

    <!-- 1. API KEY OVERLAY -->
    <div id="apiKeyOverlay" class="overlay" style="display:none">
        <div class="login-card">
            <div class="login-header">
                <h2>AccountsPro API</h2>
                <h1>Setup Connectivity</h1>
            </div>
            <div class="login-body">
                <div class="input-group">
                    <label>Master API Key</label>
                    <input type="password" id="apiKeyInput" placeholder="Enter your key...">
                </div>
                <button class="login-btn" id="validateKeyBtn" onclick="saveApiKey()">Validate Connectivity</button>
            </div>
        </div>
    </div>

    <!-- 2. SUB LOGIN OVERLAY -->
    <div id="subLoginOverlay" class="overlay" style="display:none">
        <div class="login-card">
            <div class="login-header">
                <div class="back-btn" onclick="clearApiKey()"><i data-lucide="arrow-left"></i></div>
                <h2>Sub Login Page</h2>
                <h1 id="loginCompanyName">Fetching Company...</h1>
            </div>
            <div class="login-tabs">
                <div class="login-tab active" id="tabTeam" onclick="setLoginType('team')">Team Member</div>
                <div class="login-tab" id="tabAdmin" onclick="setLoginType('admin')">Administrator</div>
            </div>
            <div class="login-body">
                <div class="input-group">
                    <label>Username / Email</label>
                    <input type="text" id="subUserEmail" placeholder="e.g. nadeem">
                </div>
                <div class="input-group">
                    <label>Password / Team PIN</label>
                    <input type="password" id="subUserPass" placeholder="••••••">
                </div>
                <button class="login-btn" id="subLoginBtn" onclick="attemptSubLogin()">Login to Company</button>
            </div>
            <div class="login-footer" style="padding:20px; text-align:center; background:white; border-top:1px solid #e2e8f0">
                <p style="font-size:10px; font-weight:800; color:var(--accent); margin:0; text-transform:uppercase;">Access Restricted to Authorized Team Members</p>
                <div style="margin-top:10px; font-size:10px; color:#94a3b8">Accpro V2.6.2 <i data-lucide="refresh-cw" size="10" style="cursor:pointer" onclick="location.reload()"></i></div>
            </div>
        </div>
    </div>

    <!-- MAIN APP VIEW -->
    <header id="mainHeader" style="display:none">
        <div class="logo"><i data-lucide="layers"></i> Accpro Multi-Pay</div>
        <div class="user-chip" onclick="logoutSubUser()">
            <span id="headerUserName">Loading...</span>
            <i data-lucide="log-out" size="14"></i>
        </div>
    </header>

    <div class="app-container" id="mainApp" style="display:none">
        <div class="voucher-card">
            <div class="header-inputs">
                <div><label>Paid From (Source)</label><select id="fromAccount"><option value="">Connecting...</option></select></div>
                <div><label>Voucher Date</label><input type="date" id="vDate"></div>
                <div><label>Slip / Ref No. *</label><input type="text" id="mainRefNo" placeholder="PV-001"></div>
            </div>
            <div class="payment-rows" id="rowsContainer"></div>
            <button class="add-row-btn" id="addRowBtn"><i data-lucide="plus-circle"></i> Add Another Receiver</button>
            <div class="form-group"><label>Main Narration / Remarks</label><textarea id="mainNarration" rows="2" placeholder="Consolidated narration..."></textarea></div>
            <div class="footer-summary"><div class="total-label">Total Payment Amount</div><div class="total-value"><span id="totalDisplay">0.00</span> DHS</div></div>
            <button id="submitBtn" disabled><i data-lucide="shield-check"></i> Post Multi-Voucher</button>
        </div>
    </div>

    <div id="statusOverlay"></div>

    <script>
        lucide.createIcons();
        const state = { 
            ledgers: [], 
            accounts: [],
            companyName: localStorage.getItem('accpro_company_name') || '',
            loginType: 'team',
            subUser: JSON.parse(localStorage.getItem('accpro_sub_user')),
            rows: [{ id: Date.now(), ledger: null, amount: 0, category: 'REF NO.', againstId: null, againstRef: '', search: '', invoices: [], dueDate: '', purpose: '' }] 
        };

        const elements = {
            apiKeyOverlay: document.getElementById('apiKeyOverlay'),
            subLoginOverlay: document.getElementById('subLoginOverlay'),
            mainApp: document.getElementById('mainApp'),
            mainHeader: document.getElementById('mainHeader'),
            loginCompanyName: document.getElementById('loginCompanyName'),
            headerUserName: document.getElementById('headerUserName'),
            fromAcc: document.getElementById('fromAccount'),
            vDate: document.getElementById('vDate'),
            mainRef: document.getElementById('mainRefNo'),
            rowsContainer: document.getElementById('rowsContainer'),
            totalDisplay: document.getElementById('totalDisplay'),
            submitBtn: document.getElementById('submitBtn'),
            status: document.getElementById('statusOverlay'),
            validateKeyBtn: document.getElementById('validateKeyBtn')
        };

        elements.vDate.value = new Date().toISOString().split('T')[0];

        // STARTUP LOGIC
        if (!localStorage.getItem('accpro_api_key')) {
            elements.apiKeyOverlay.style.display = 'flex';
        } else if (!state.subUser) {
            initSubLogin();
        } else {
            initApp();
        }

        async function api(action, params = {}) {
            const key = localStorage.getItem('accpro_api_key');
            const query = new URLSearchParams({ apiKey: key, action, ...params }).toString();
            const response = await fetch(`https://accproapi-rl2gmlmsma-uc.a.run.app?${query}`);
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'API Error');
            return data;
        }

        async function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key.length < 10) return showStatus("Invalid API Key", "red");
            elements.validateKeyBtn.disabled = true;
            elements.validateKeyBtn.innerText = "Connecting...";
            try {
                localStorage.setItem('accpro_api_key', key);
                const data = await api('validate_key');
                state.companyName = data.companyName;
                localStorage.setItem('accpro_company_name', data.companyName);
                showStatus(`CONNECTED TO: ${data.companyName}`, 'green');
                setTimeout(() => initSubLogin(), 1000);
            } catch (e) { showStatus(e.message, 'red'); localStorage.removeItem('accpro_api_key'); }
            finally { elements.validateKeyBtn.disabled = false; elements.validateKeyBtn.innerText = "Validate Connectivity"; }
        }

        async function initSubLogin() {
            elements.apiKeyOverlay.style.display = 'none';
            elements.subLoginOverlay.style.display = 'flex';
            elements.loginCompanyName.innerText = state.companyName || "Company Found";
            // Silent refresh of company name
            api('validate_key').then(d => { 
                state.companyName = d.companyName; 
                elements.loginCompanyName.innerText = d.companyName; 
                localStorage.setItem('accpro_company_name', d.companyName);
            }).catch(e => console.error("Sync error:", e));
        }

        async function attemptSubLogin() {
            const email = document.getElementById('subUserEmail').value.trim().toLowerCase();
            const pass = document.getElementById('subUserPass').value.trim();
            if(!email || !pass) return showStatus("Enter email and password", "red");
            document.getElementById('subLoginBtn').disabled = true;
            try {
                const res = await api('verify_team_login', { username: email, password: pass, type: state.loginType });
                localStorage.setItem('accpro_sub_user', JSON.stringify(res.user));
                state.subUser = res.user;
                initApp();
            } catch (e) { showStatus(e.message, 'red'); }
            finally { document.getElementById('subLoginBtn').disabled = false; }
        }

        async function initApp() {
            elements.apiKeyOverlay.style.display = 'none';
            elements.subLoginOverlay.style.display = 'none';
            elements.mainApp.style.display = 'block';
            elements.mainHeader.style.display = 'flex';
            elements.headerUserName.innerText = state.subUser.name;
            try {
                const [accData, ledgData] = await Promise.all([api('list_accounts'), api('list_ledgers')]);
                state.accounts = accData.accounts;
                state.ledgers = ledgData.ledgers;
                elements.fromAcc.innerHTML = state.accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
                elements.mainRef.value = "PV-" + Math.floor(1000 + Math.random()*9000);
                renderRows();
                elements.submitBtn.disabled = false;
            } catch (err) { showStatus(err.message, "red"); }
        }

        function clearApiKey() { localStorage.clear(); location.reload(); }
        function logoutSubUser() { localStorage.removeItem('accpro_sub_user'); location.reload(); }
        function setLoginType(t) { state.loginType = t; document.getElementById('tabTeam').classList.toggle('active', t === 'team'); document.getElementById('tabAdmin').classList.toggle('active', t === 'admin'); }
        function showStatus(msg, color) { elements.status.innerText = msg; elements.status.style.background = color === 'red' ? '#fee2e2' : '#dcfce7'; elements.status.style.color = color === 'red' ? '#b91c1c' : '#15803d'; elements.status.style.display = 'block'; setTimeout(() => elements.status.style.display = 'none', 3000); }

        function formatCurrency(amt) { return Number(amt).toLocaleString(undefined, { minimumFractionDigits: 3, maximumFractionDigits: 3 }); }
        const CATEGORY_MAP = { 'REF NO.': 'Normal payment against reference.', 'OUR ADVANCE': 'Advance given BY US to this party.', 'THEIR ADVANCE': 'Advance received FROM this party.', 'OUR LOAN': 'Loan given BY US to this party.', 'THEIR LOAN': 'Loan received FROM this party.' };

        function renderRows() {
            elements.rowsContainer.innerHTML = '';
            state.rows.forEach((row, index) => {
                const isParty = row.ledger && row.ledger.collection === 'parties';
                const div = document.createElement('div');
                div.className = 'payment-row';
                div.innerHTML = `
                    <div class="row-header"><div class="row-number">Receiver #${index + 1}</div>${state.rows.length > 1 ? `<button class="remove-btn" onclick="removeRow(${index})"><i data-lucide="trash-2" size="16"></i></button>` : ''}</div>
                    ${isParty ? `<div class="category-tabs">${Object.keys(CATEGORY_MAP).map(cat => `<div class="tab ${row.category === cat ? 'active' : ''}" onclick="setCategory(${index}, '${cat}')">${cat}</div>`).join('')}</div>` : ''}
                    <div class="row-grid">
                        <div class="search-select"><label>Paid To</label><div class="search-trigger" onclick="toggleDropdown(${index})">${row.ledger ? row.ledger.name : 'Search Account...'} <i data-lucide="chevron-down" size="14"></i></div>
                            <div class="search-dropdown" id="drop-${index}"><div class="search-input"><input type="text" placeholder="Type name..." oninput="filterLedgers(${index}, this.value)" value="${row.search}" onclick="event.stopPropagation()"></div><div class="options-list" id="opts-${index}"></div></div>
                        </div>
                        <div><label>Amount (DHS)</label><input type="number" value="${row.amount || ''}" oninput="updateField(${index}, 'amount', Number(this.value))" placeholder="0.00"></div>
                    </div>
                    ${isParty ? `<div class="against-box"><div class="mode-banner">${CATEGORY_MAP[row.category]}</div>
                        ${row.category === 'REF NO.' ? `<label>AGAINST PURCHASE REF NO.</label><select onchange="updateAgainst(${index}, this.value, this.options[this.selectedIndex].getAttribute('data-ref'))"><option value="">-- Select Reference --</option>${row.invoices.map(inv => `<option value="${inv.id}" data-ref="${inv.refNo}" ${row.againstId === inv.id ? 'selected' : ''}>${inv.refNo} (Rem: ${formatCurrency(inv.remainingAmount)})</option>`).join('')}</select>` : `
                        <div class="detail-row"><div><label>REF NO. *</label><div style="display:flex; gap:10px"><input type="text" value="${row.againstRef || ''}" oninput="updateField(${index}, 'againstRef', this.value)"><button class="auto-btn" onclick="genAutoRef(${index})"><i data-lucide="refresh-cw" size="12"></i> Auto</button></div></div><div><label>DUE DATE</label><input type="date" value="${row.dueDate || ''}" oninput="updateField(${index}, 'dueDate', this.value)"></div></div>
                        <div class="form-group"><label>PURPOSE</label><textarea rows="2" placeholder="${row.category} details..." oninput="updateField(${index}, 'purpose', this.value)">${row.purpose || ''}</textarea></div>`}</div>` : ''}
                `;
                elements.rowsContainer.appendChild(div);
                if (row.dropdownOpen) { filterLedgers(index, row.search); document.getElementById(`drop-${index}`).classList.add('open'); }
            });
            updateTotal(); lucide.createIcons();
        }

        window.addRow = () => { state.rows.push({ id: Date.now(), ledger: null, amount: 0, category: 'REF NO.', againstId: null, againstRef: '', search: '', invoices: [], dueDate: '', purpose: '' }); renderRows(); };
        document.getElementById('addRowBtn').onclick = addRow;
        window.removeRow = (i) => { state.rows.splice(i, 1); renderRows(); };
        window.setCategory = (i, c) => { state.rows[i].category = c; state.rows[i].againstId = null; if (c !== 'REF NO.') genAutoRef(i); else state.rows[i].againstRef = ''; renderRows(); };
        window.genAutoRef = (i) => { state.rows[i].againstRef = state.rows[i].category.split(' ').map(w => w[0]).join('') + Math.floor(1000 + Math.random()*9000); renderRows(); };
        window.updateField = (i, f, v) => { state.rows[i][f] = v; if (f === 'amount') updateTotal(); };
        window.updateAgainst = (i, id, ref) => { state.rows[i].againstId = id; state.rows[i].againstRef = id ? ref : ''; };
        function updateTotal() { const t = state.rows.reduce((s, r) => s + (r.amount || 0), 0); elements.totalDisplay.innerText = t.toLocaleString(undefined, { minimumFractionDigits: 2 }); }
        window.toggleDropdown = (i) => { state.rows.forEach((r, idx) => { if(idx !== i) r.dropdownOpen = false; }); state.rows[i].dropdownOpen = !state.rows[i].dropdownOpen; renderRows(); };
        window.filterLedgers = (i, s) => { state.rows[i].search = s; const q = s.toLowerCase().split(' ').filter(x => x); const filtered = state.ledgers.filter(l => q.every(k => l.name.toLowerCase().includes(k))).slice(0, 20); const list = document.getElementById(`opts-${i}`); list.innerHTML = filtered.map(l => `<div class="option-item" onclick="selectLedger(${i}, '${l.id}')"><span>${l.name}</span><span style="font-size:9px; color:#64748b">${l.collection.toUpperCase()}</span></div>`).join(''); };
        window.selectLedger = async (i, lid) => { const l = state.ledgers.find(x => x.id === lid); state.rows[i].ledger = l; state.rows[i].dropdownOpen = false; state.rows[i].category = 'REF NO.'; state.rows[i].invoices = []; if (l.collection === 'parties') { renderRows(); const d = await api('list_party_invoices', { partyId: lid }); state.rows[i].invoices = d.invoices; } renderRows(); };

        elements.submitBtn.onclick = async () => {
            if (!elements.mainRef.value) return showStatus("Ref No. is mandatory!", "red");
            const payments = state.rows.filter(r => r.ledger && r.amount > 0).map(r => ({ ledgerId: r.ledger.id, ledgerCollection: r.ledger.collection, amount: r.amount, category: r.category, againstId: r.againstId, againstRef: r.againstRef, dueDate: r.dueDate, purpose: r.purpose }));
            if (payments.length === 0) return showStatus("Add a payment line", "red");
            elements.submitBtn.disabled = true;
            try {
                await api('add_payment', { accountId: elements.fromAcc.value, date: elements.vDate.value, refNo: elements.mainRef.value, narration: document.getElementById('mainNarration').value, payments: JSON.stringify(payments), subUserId: state.subUser.id });
                showStatus("Voucher Posted!", "green");
                state.rows = [{ id: Date.now(), ledger: null, amount: 0, category: 'REF NO.', againstId: null, againstRef: '', search: '', invoices: [], dueDate: '', purpose: '' }];
                document.getElementById('mainNarration').value = ""; elements.mainRef.value = "PV-" + Math.floor(1000 + Math.random()*9000); renderRows();
            } catch (err) { showStatus(err.message, "red"); }
            finally { elements.submitBtn.disabled = false; lucide.createIcons(); }
        };

        document.addEventListener('click', (e) => { if (!e.target.closest('.search-select')) { let c = false; state.rows.forEach(r => { if(r.dropdownOpen) { r.dropdownOpen = false; c = true; } }); if(c) renderRows(); } });
    </script>
</body>
</html>
